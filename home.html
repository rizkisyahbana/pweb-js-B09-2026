<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Shopee — Belanja Santai Ala Piknik</title>
<style>
  /* Font bubble/rounded gratis yang paling mendekati "Boulder" (font itu berbayar,
     tidak tersedia gratis via Google Fonts / CDN). */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; height: 100%; }

  body{
    min-height: 100vh;
    font-family: "Segoe UI", -apple-system, sans-serif;

    /* ===== HANYA foto home.jpg sebagai background, tanpa elemen buatan lain ===== */
    background-image: url("images/home.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #F5E6CE; /* fallback kalau home.jpg belum ada di folder */

    position: relative;
    overflow: hidden;
  }

  .overlay{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 20px;
  }

  /* ---------------- Judul MINI SHOPEE ---------------- */
  .title-line{
    display: flex;
    justify-content: center;
  }
  .title-line span{
    display: inline-block;
    font-family: "Baloo 2", "Segoe UI", sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 8.5vw, 92px);
    line-height: 1;
    background: linear-gradient(180deg, #FCE9A8 0%, #E8A33D 55%, #C1272D 130%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 2px #5b3418;
    text-shadow: 3px 5px 0 rgba(43, 33, 24, 0.4);
    transition: transform 0.2s ease, filter 0.2s ease;
    cursor: default;
  }
  .title-line span:hover{
    transform: translateY(-16px) scale(1.14) rotate(0deg) !important;
    filter: drop-shadow(0 16px 12px rgba(43, 33, 24, 0.45));
    z-index: 2;
  }

  .line-1 span:nth-child(1){ transform: rotate(-3deg); }
  .line-1 span:nth-child(2){ transform: rotate(2deg); }
  .line-1 span:nth-child(3){ transform: rotate(-2deg); }
  .line-1 span:nth-child(4){ transform: rotate(3deg); }

  .line-2 span:nth-child(1){ transform: rotate(-2deg); }
  .line-2 span:nth-child(2){ transform: rotate(3deg); }
  .line-2 span:nth-child(3){ transform: rotate(-3deg); }
  .line-2 span:nth-child(4){ transform: rotate(2deg); }
  .line-2 span:nth-child(5){ transform: rotate(-2deg); }
  .line-2 span:nth-child(6){ transform: rotate(3deg); }

  .sr-only{
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------------- Tombol Login (di tengah halaman) ---------------- */
  .login-btn{
    font-family: "Baloo 2", "Segoe UI", sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #fff;
    text-decoration: none;
    background: #E8A33D;
    padding: 14px 44px;
    border-radius: 999px;
    box-shadow: 0 10px 22px rgba(43, 33, 24, 0.32);
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .login-btn:hover{
    transform: translateY(-4px);
    background: #C9822A;
    box-shadow: 0 16px 28px rgba(43, 33, 24, 0.4);
  }
  .login-btn:focus-visible{ outline: 3px solid #C1272D; outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

  <div class="overlay">
    <h1 style="margin:0; text-align:center;">
      <span class="sr-only">Mini Shopee</span>
      <span class="title-line line-1" aria-hidden="true">
        <span>M</span><span>I</span><span>N</span><span>I</span>
      </span>
      <span class="title-line line-2" aria-hidden="true">
        <span>S</span><span>H</span><span>O</span><span>P</span><span>E</span><span>E</span>
      </span>
    </h1>

    <a href="login.html" class="login-btn">Login</a>
  </div>

</body>
</html>
